# Render's free tier sleeps after ~15 minutes without traffic, and a sleeping instance loses
# its SQLite file on wake-up. Pinging the API regularly keeps the demo awake so learner
# progress persists between visits. (GitHub may delay scheduled runs by a few minutes.)
name: Keep demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health check
        run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 10 https://duolingo-clone-api-lmzz.onrender.com/api/health
